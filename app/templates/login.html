{% extends "base.html" %}
{% block title %}로그인 · Seeding Scout{% endblock %}
{% block body %}
<section class="masthead">
  <div class="top">
    <div>
      <p class="eyebrow">Sign in</p>
      <h1>로그인</h1>
    </div>
  </div>
</section>

<div class="surface pad" style="max-width: 380px">
  {% if error %}<p class="loginerr">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" autocomplete="current-password"
           autofocus required>
    <button class="btn" type="submit">로그인</button>
  </form>
  <p class="hint">
    서버의 <code>SCOUT_PASSWORD</code> 환경변수에 설정된 비밀번호입니다.
  </p>
</div>
{% endblock %}
